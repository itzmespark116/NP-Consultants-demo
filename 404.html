<!-- File Type : Shell / 404 Error Page -->
<!-- Custom 404 page displaying error message and navigation back to home. -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Consultants &nbsp;&bull;&nbsp; 404</title>

    <script>
        const prefix = 1;
        const pagePath = location.pathname.endsWith("/") ? location.pathname : `${location.pathname}/`;
        const pageUrl = new URL(pagePath, location.origin);
        const pathDepth = Math.max(0, pageUrl.pathname.split("/").filter(Boolean).length - prefix);
        const base = document.createElement("base");
        base.href = new URL("../".repeat(pathDepth), pageUrl).href;
        document.head.appendChild(base);
    </script>

    <link rel="icon" href="resources/img/brand/icon_light.png" type="image/png"
        media="(prefers-color-scheme: light)">
    <link rel="icon" href="resources/img/brand/icon_dark.png" type="image/png" media="(prefers-color-scheme: dark)">

    <link rel="stylesheet" href="resources/css/root.css">
    <link rel="stylesheet" href="resources/css/body.css">
    <link rel="stylesheet" href="resources/css/image-loading.css">

    <link rel="stylesheet" href="resources/css/nav.css">
    <link rel="stylesheet" href="resources/css/nav-links.css">
    <link rel="stylesheet" href="resources/css/nav-toggle.css">

    <link rel="stylesheet" href="resources/css/buttons/button-theme-toggle.css">
    <link rel="stylesheet" href="resources/css/buttons/button.css">

    <link rel="stylesheet" href="resources/css/footer.css">

    <style>
        ::-webkit-scrollbar {
            display: none;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        main {
            min-height: inherit;
            display: flex;
            flex-direction: column;
        }

        .footer {
            position: absolute;
            top: 100vh;
            top: 100dvh;
        }
    </style>

    <style>
        /* ─ 404 · tech grid ─────────────────────────────── */
        .section-404 {
            --g-size: 3rem;
            --g-line: color-mix(in srgb, currentColor 12%, transparent);
            --g-accent: var(--accent, currentColor);
            --g-edge: color-mix(in srgb, currentColor 28%, transparent);
            --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            --g-pad: 1.5rem;
            --g-gap: 1.25rem;
            position: relative;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: calc(var(--nav-height, 5rem) + 2rem) var(--g-pad) 3rem;
            text-align: center;
            overflow: hidden;
            isolation: isolate;
        }

        /* grid, faded to the edges */
        .section-404 .grid {
            position: absolute;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(to right, var(--g-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--g-line) 1px, transparent 1px);
            background-size: var(--g-size) var(--g-size);
            background-position: center;
            -webkit-mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 10%, transparent 100%);
            mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, #000 10%, transparent 100%);
        }

        /* accent glow */
        .section-404::before {
            content: "";
            position: absolute;
            inset: 50% auto auto 50%;
            width: min(50rem, 110vw);
            aspect-ratio: 1;
            translate: -50% -50%;
            background: radial-gradient(closest-side,
                    color-mix(in srgb, var(--g-accent) 18%, transparent), transparent);
            z-index: -1;
        }

        /* scan line */
        .section-404 .scan {
            position: absolute;
            inset: 0 0 auto;
            height: 8rem;
            z-index: -1;
            background: linear-gradient(to bottom, transparent,
                    color-mix(in srgb, var(--g-accent) 14%, transparent), transparent);
            -webkit-mask-image: radial-gradient(ellipse 60% 100% at 50% 50%, #000, transparent);
            mask-image: radial-gradient(ellipse 60% 100% at 50% 50%, #000, transparent);
            opacity: 0;
        }

        .section-404 .section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--g-gap);
            width: 100%;
            max-width: 38rem;
        }

        .section-404 .tag {
            margin: 0;
            padding: .35rem .8rem;
            font: 500 .8rem/1 var(--mono);
            letter-spacing: .15em;
            text-transform: uppercase;
            white-space: nowrap;
            border: 1px solid var(--g-edge);
            border-radius: 99rem;
            background: color-mix(in srgb, currentColor 5%, transparent);
        }

        .section-404 .tag i {
            display: inline-block;
            width: .5rem;
            height: .5rem;
            margin-right: .6rem;
            border-radius: 50%;
            background: var(--g-accent);
            box-shadow: 0 0 .75rem var(--g-accent);
        }

        /* big code, tinted fill + stroke, faded bottom */
        .section-404 .code {
            position: relative;
            margin: 0;
            font-size: clamp(5rem, 28vw, 14rem);
            font-weight: 800;
            line-height: .9;
            letter-spacing: -.04em;
            color: inherit;
            -webkit-text-fill-color: color-mix(in srgb, var(--g-accent) 10%, transparent);
            -webkit-text-stroke: 2px color-mix(in srgb, var(--g-accent) 75%, currentColor);
            -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent 95%);
            mask-image: linear-gradient(to bottom, #000 20%, transparent 95%);
        }

        .section-404 .code::before,
        .section-404 .code::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            -webkit-text-fill-color: transparent;
            opacity: 0;
        }

        .section-404 h1 {
            margin: 0;
            font-size: clamp(1.4rem, 5vw, 2rem);
            line-height: 1.2;
        }

        .section-404 .desc {
            margin: 0;
            font-size: clamp(.95rem, 3.5vw, 1.1rem);
            line-height: 1.6;
            opacity: .7;
        }

        /* terminal readout */
        .section-404 .panel {
            position: relative;
            display: grid;
            grid-template-rows: 1fr;
            width: 100%;
            padding: 1rem 1.25rem;
            text-align: left;
            font: 400 .85rem/1.7 var(--mono);
            border: 1px solid var(--g-edge);
            background: color-mix(in srgb, currentColor 4%, transparent);
            -webkit-backdrop-filter: blur(.5rem);
            backdrop-filter: blur(.5rem);
            overflow-wrap: anywhere;
        }

        .section-404 .panel .inner {
            min-height: 0;
            overflow: hidden;
        }

        .section-404 .panel::before,
        .section-404 .panel::after {
            content: "";
            position: absolute;
            width: .9rem;
            height: .9rem;
            border: 2px solid var(--g-accent);
        }

        .section-404 .panel::before {
            top: -2px;
            left: -2px;
            border-right: 0;
            border-bottom: 0;
        }

        .section-404 .panel::after {
            right: -2px;
            bottom: -2px;
            border-left: 0;
            border-top: 0;
        }

        .section-404 .panel span {
            opacity: .55;
        }

        .section-404 .panel b {
            color: var(--g-accent);
            font-weight: 500;
        }

        .section-404 .panel .cursor {
            display: inline-block;
            width: .5em;
            height: 1em;
            margin-left: .25rem;
            vertical-align: text-bottom;
            background: var(--g-accent);
            opacity: 1;
        }

        .section-404 .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            width: 100%;
        }

        @media (prefers-reduced-motion: no-preference) {
            .section-404 .grid {
                animation: s404-grid 1.6s ease-out both;
            }

            .section-404 .scan {
                animation: s404-scan 6s linear 1s infinite;
            }

            .section-404 .tag,
            .section-404 .code,
            .section-404 h1,
            .section-404 .desc,
            .section-404 .panel,
            .section-404 .actions {
                opacity: 0;
                animation: s404-in .8s cubic-bezier(.22, 1, .36, 1) forwards;
                animation-delay: calc(.2s + var(--i) * .12s);
            }

            .section-404 .panel {
                animation: s404-in .8s cubic-bezier(.22, 1, .36, 1) forwards,
                    s404-grow-w .7s cubic-bezier(.22, 1, .36, 1) both,
                    s404-grow-h .8s cubic-bezier(.22, 1, .36, 1) both;
                animation-delay:
                    calc(.2s + var(--i) * .12s),
                    calc(.2s + var(--i) * .12s),
                    calc(.9s + var(--i) * .12s);
            }

            .section-404 .code::before {
                -webkit-text-fill-color: var(--g-accent);
                background: none;
                animation: s404-glitch-a 5s steps(1) 2s infinite;
            }

            .section-404 .code::after {
                -webkit-text-fill-color: currentColor;
                background: none;
                animation: s404-glitch-b 5s steps(1) 2s infinite;
            }

            .section-404 .cursor {
                animation: s404-blink 1s steps(1) infinite;
            }

            .section-404 .tag i {
                animation: s404-blink 1.6s ease-in-out infinite;
            }
        }

        @keyframes s404-in {
            from {
                opacity: 0;
                transform: translateY(1rem);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes s404-grow-w {
            from {
                width: 0;
            }
        }

        @keyframes s404-grow-h {
            from {
                grid-template-rows: 0fr;
                padding-block: 0;
            }
        }

        @keyframes s404-grid {
            from {
                opacity: 0;
                transform: scale(1.15);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        @keyframes s404-scan {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            10%,
            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        @keyframes s404-blink {
            50% {
                opacity: 0;
            }
        }

        @keyframes s404-glitch-a {

            0%,
            92%,
            100% {
                opacity: 0;
            }

            93% {
                opacity: .8;
                transform: translate(-.04em, 0);
                clip-path: inset(15% 0 55% 0);
            }

            96% {
                opacity: .8;
                transform: translate(.03em, 0);
                clip-path: inset(60% 0 10% 0);
            }
        }

        @keyframes s404-glitch-b {

            0%,
            93%,
            100% {
                opacity: 0;
            }

            94% {
                opacity: .6;
                transform: translate(.05em, 0);
                clip-path: inset(40% 0 35% 0);
            }

            97% {
                opacity: .6;
                transform: translate(-.03em, 0);
                clip-path: inset(5% 0 75% 0);
            }
        }

        /* tablet / phone */
        @media (max-width: 43.75rem) {
            .section-404 {
                --g-size: 2.25rem;
                --g-pad: 1.25rem;
                --g-gap: 1rem;
                padding-top: calc(var(--nav-height, 4rem) + 1.5rem);
                padding-bottom: 2rem;
            }

            .section-404 .panel {
                padding: .9rem 1rem;
                font-size: .8rem;
            }

            .section-404 .actions {
                flex-direction: column;
                align-items: stretch;
                max-width: 20rem;
                gap: .75rem;
            }

            .section-404 .actions .button {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }

        /* small phone */
        @media (max-width: 25rem) {
            .section-404 {
                --g-size: 1.75rem;
                --g-pad: 1rem;
                --g-gap: .875rem;
            }

            .section-404 .tag {
                padding: .3rem .65rem;
                font-size: .68rem;
                letter-spacing: .1em;
            }

            .section-404 .panel {
                padding: .75rem .85rem;
                font-size: .72rem;
                line-height: 1.6;
            }
        }

        /* landscape phone */
        @media (max-height: 37.5rem) {
            .section-404 {
                --g-gap: .75rem;
                padding-top: calc(var(--nav-height, 4rem) + 1rem);
                padding-bottom: 1.5rem;
            }

            .section-404 .code {
                font-size: clamp(3.5rem, 20vh, 8rem);
            }

            .section-404 .panel {
                padding: .6rem .9rem;
                font-size: .72rem;
                line-height: 1.5;
            }

            .section-404 .actions {
                flex-direction: row;
                max-width: none;
            }

            .section-404 .actions .button {
                width: auto;
            }
        }
    </style>

    <script src="resources/js/theme-init.js"></script>

</head>

<body>

    <main>

        <header id="mainHeader"></header>

        <section class="section section-404">
            <div class="grid"></div>
            <div class="scan"></div>

            <div class="section-content">
                <p class="tag" style="--i:0"><i></i>Error 404</p>
                <div class="code" style="--i:1" data-text="404" aria-hidden="true">404</div>
                <h1 style="--i:2">Page not found</h1>
                <p class="desc" style="--i:3">The page you're looking for has moved, been renamed, or never existed.</p>

                <div class="panel" style="--i:4">
                    <div class="inner">
                        <span>$</span> GET <b id="path404">/</b><br>
                        <span>→</span> status: <b>404 NOT_FOUND</b><span class="cursor"></span>
                    </div>
                </div>

                <div class="actions" style="--i:5">
                    <a class="button" href="home/">Back to home</a>
                    <a class="button secondary" href="javascript:history.back()">Go back</a>
                </div>
            </div>
        </section>

        <footer class="footer"></footer>

    </main>

    <script>
        document.getElementById("path404").textContent = location.pathname + location.search;
    </script>

    <script type="module" src="resources/js/modules/intro.js"></script>
    <script type="module" src="resources/js/modules/image-loading.js"></script>
    <script type="module" src="resources/js/modules/theme-switch.js"></script>

    <script type="module" src="resources/js/nav/nav-header.js"></script>
    <script type="module" src="resources/js/nav/nav-writer.js"></script>
    <script type="module" src="resources/js/nav/navbar.js"></script>
    <script type="module" src="resources/js/nav/nav-links.js"></script>
    <script type="module" src="resources/js/nav/nav-toggle.js"></script>

    <script type="module" src="resources/js/footer.js"></script>

</body>

</html>
