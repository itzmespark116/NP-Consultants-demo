<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Consultants &nbsp;&bull;&nbsp; Home</title>

    <!-- Favicon: set by JS from paths.json; fallback inline -->
    <link rel="shortcut icon" href="../resources/img/brand/icon_dark.png" type="image/x-icon">

    <!-- Global styles -->
    <link rel="stylesheet" href="../resources/css/root.css">
    <link rel="stylesheet" href="../resources/css/body.css">
    <link rel="stylesheet" href="../resources/css/scrollbar.css">

    <!-- Navigation styles -->
    <link rel="stylesheet" href="../resources/css/nav.css">
    <link rel="stylesheet" href="../resources/css/nav-links.css">
    <link rel="stylesheet" href="../resources/css/nav-toggle.css">

    <!-- Button styles -->
    <link rel="stylesheet" href="../resources/css/buttons/button-theme-toggle.css">
    <link rel="stylesheet" href="../resources/css/buttons/button.css">

    <!-- Page section styles -->
    <link rel="stylesheet" href="../resources/css/intro.css">
    <link rel="stylesheet" href="../resources/css/sections/homepage-banner.css">
    <link rel="stylesheet" href="../resources/css/sections/homepage-about.css">
    <link rel="stylesheet" href="../resources/css/sections/homepage-services.css">
    <link rel="stylesheet" href="../resources/css/sections/homepage-projects.css">
    <link rel="stylesheet" href="../resources/css/sections/homepage-contact.css">

    <link rel="stylesheet" href="../resources/css/footer.css">

    <!-- Theme init: runs synchronously before first paint to prevent flash -->
    <script src="../resources/js/theme-init.js"></script>
</head>

<body>

    <!-- Intro splash screen — image src set by intro.js via paths.json -->
    <div class="intro">
        <img alt="NP Consultants">
    </div>

    <main>
        <!-- Header written entirely by nav-header.js via paths.json -->
        <header id="mainHeader"></header>

        <section class="banner"></section>
        <section id="about-us" class="about"></section>
        <section id="services" class="services"></section>
        <section id="projects" class="projects"></section>
        <section class="cta"></section>

        <footer class="footer"></footer>

    </main>

    <!-- ── Module loading order ─────────────────────────────────────────────
         1. intro.js          — sets splash image, starts timer (reads paths.js)
         2. theme-switch.js   — awaits header, then wires theme toggle
         3. nav-header.js     — writes <header> markup from paths.json
         4. nav-writer.js     — fills #navLinks from nav.json
         5. navbar.js         — scroll-shrink pill listener
         6. nav-links.js      — active page + sliding underline
         7. nav-toggle.js     — mobile drawer open/close
         8. homepage-banner   — hero video + content
         9. homepage-about    — about cards
        10. homepage-services — services grid
        11. homepage-projects — featured projects grid
        12. footer.js         — footer section
    ─────────────────────────────────────────────────────────────────────── -->
    <script type="module" src="../resources/js/modules/intro.js"></script>
    <script type="module" src="../resources/js/modules/theme-switch.js"></script>

    <script type="module" src="../resources/js/nav/nav-header.js"></script>
    <script type="module" src="../resources/js/nav/nav-writer.js"></script>
    <script type="module" src="../resources/js/nav/navbar.js"></script>
    <script type="module" src="../resources/js/nav/nav-links.js"></script>
    <script type="module" src="../resources/js/nav/nav-toggle.js"></script>

    <script type="module" src="../resources/js/homepage/homepage-banner.js"></script>
    <script type="module" src="../resources/js/homepage/homepage-about.js"></script>
    <script type="module" src="../resources/js/homepage/homepage-services.js"></script>
    <script type="module" src="../resources/js/homepage/homepage-projects.js"></script>
    <script type="module" src="../resources/js/homepage/homepage-contact.js"></script>

    <script type="module" src="../resources/js/footer.js"></script>

</body>

</html>
