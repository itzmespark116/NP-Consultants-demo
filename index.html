<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NP Consultants &nbsp;&bull;&nbsp; Failed Redirection</title>

    <meta http-equiv="refresh" content="0;url=/home/">

    <link rel="stylesheet" href="/css/toast.css">

    <style>
        html {
            background: var(--base);
        }

        @media(prefers-color-scheme: dark) {
            :root {
                --base: #000;
                --color: #fff
            }
        }

        @media(prefers-color-scheme: light) {
            :root {
                --base: #fff;
                --color: #000
            }
        }

        * {
            -webkit-user-select: none;
            user-select: none;
        }

        :root {
            --debug: red;
            --debug-pattern: linear-gradient(45deg,
                    var(--base) 0% 4%,
                    var(--debug) 5%, var(--base) 6% 9%,
                    var(--debug) 10%, var(--base) 11% 14%,
                    var(--debug) 15%, var(--base) 16% 19%,
                    var(--debug) 20%, var(--base) 21% 24%,
                    var(--debug) 25%, var(--base) 26% 29%,
                    var(--debug) 30%, var(--base) 31% 34%,
                    var(--debug) 35%, var(--base) 36% 39%,
                    var(--debug) 40%, var(--base) 41% 44%,
                    var(--debug) 45%, var(--base) 46% 49%,
                    var(--debug) 50%, var(--base) 51% 54%,
                    var(--debug) 55%, var(--base) 56% 59%,
                    var(--debug) 60%, var(--base) 61% 64%,
                    var(--debug) 65%, var(--base) 66% 69%,
                    var(--debug) 70%, var(--base) 71% 74%,
                    var(--debug) 75%, var(--base) 76% 79%,
                    var(--debug) 80%, var(--base) 81% 84%,
                    var(--debug) 85%, var(--base) 86% 89%,
                    var(--debug) 90%, var(--base) 91% 94%,
                    var(--debug) 95%, var(--base) 96% 99%);
        }

        body {
            overflow: hidden;
            margin: 0;
            padding: 0;

            background: var(--debug-pattern);

            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: var(--color);
        }

        main {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            width: 100dvw;
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            filter: brightness(0.8);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: color-mix(in srgb, var(--base) 50%, transparent);
            border: 1px solid red;
            border-radius: 12px;
            filter: brightness(1);
            padding: 4rem;
        }

        h2 {
            font-size: 2.2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0ch;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.1ch;
            margin: 0;
            padding: 0;
        }

        button {
            padding: 1rem 2rem;
            margin: 2rem;
            margin-bottom: -1rem;
            background: red;
            color: var(--color);
            font-size: 1rem;
            font-weight: 600;
            border: var(--base);
            border-radius: 8px;
            transition: 0.3s ease;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
            filter: brightness(1.2);
        }

        .sad-icon {
            width: 100px;
            height: 100px;
            margin: 1rem;
            margin-top: -1rem;
        }
    </style>

</head>

<body>

    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/backend-gate.js"></script>

    <main>
        <div class="container">
            <svg class="sad-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <circle cx="16" cy="16" r="14" fill="var(--base)" stroke="red" stroke-width="2" />
                <circle cx="11.5" cy="13" r="1.5" fill="red" />
                <circle cx="20.5" cy="13" r="1.5" fill="red" />
                <path d="M10.5 22C12.5 18.5 19.5 18.5 21.5 22" fill="none" stroke="red" stroke-width="2"
                    stroke-linecap="round" />
            </svg>
            <h2>Redirection Failed!</h2>
            <h1><i><b>Warning :</b> Possible low bandwidth</i></h1>
            <button data-href="/home/">Click Here to redirect manually</button>
        </div>
    </main>

    <script src="/js/nav-buttons.js"></script>
</body>

</html>
