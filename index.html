<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <script>
        fetch("home/index.html")
            .then(r => r.text())
            .then(html => {
                html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + new URL("home/", location.href).href + '">');
                document.open();
                document.write(html);
                document.close();
            });
    </script>
</head>

<body></body>

</html>
